<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng Anh – Việt: Flashcard & Luyện tập</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#e3ebee; --card:#fffefb; --ink:#1c2631; --muted:#5d6b7a; --rule:#d3e0ec; --red:#e0584f;
  --accent:#2a55d4; --accent-ink:#fff; --hl:#ffe45e; --hl-ink:#1c2631; --ok:#1f8a58; --ok-bg:#e3f4ea; --no:#c8453d; --no-bg:#fbe7e5;
  --chip:#f4f8fa; --line:#c3d0da;
  --shadow:0 1px 0 rgba(28,38,49,.06),0 18px 40px -18px rgba(28,38,49,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#12181f; --card:#1e2733; --ink:#e9eef4; --muted:#9aa9b9; --rule:#2c3948; --red:#e86d64;
    --accent:#7a9bff; --accent-ink:#0f1620; --hl:#6e5f10; --hl-ink:#fff4b8; --ok:#4cc38a; --ok-bg:#16322a; --no:#ef7d74; --no-bg:#3a1f1e;
    --chip:#18212b; --line:#344254; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --desk:#12181f; --card:#1e2733; --ink:#e9eef4; --muted:#9aa9b9; --rule:#2c3948; --red:#e86d64;
  --accent:#7a9bff; --accent-ink:#0f1620; --hl:#6e5f10; --hl-ink:#fff4b8; --ok:#4cc38a; --ok-bg:#16322a; --no:#ef7d74; --no-bg:#3a1f1e;
  --chip:#18212b; --line:#344254; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
#pr h1,#pr h2,#pr h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
#pr h1{font-size:1.5rem}
#pr .sub{color:var(--muted);margin:2px 0 18px;font-size:.95rem}
#pr .sheet{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px}
#pr .sheet h2{font-size:1.05rem;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--red)}
#pr .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pr .mode{text-align:left;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:64px}
#pr .mode b{display:block;font-weight:600}
#pr .mode span{display:block;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
#pr .mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--card)}
#pr .mode.wide{grid-column:1/-1}
#pr .chips{display:flex;flex-wrap:wrap;gap:8px}
#pr .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
#pr .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pr .links{display:flex;gap:14px;margin-top:10px;font-size:.85rem}
#pr .link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
#pr .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#pr .seg button{font:inherit;border:0;background:var(--chip);color:var(--ink);padding:8px 16px;cursor:pointer;border-right:1px solid var(--line)}
#pr .seg button:last-child{border-right:0}
#pr .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#pr .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pr .check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.92rem}
#pr .check input{width:18px;height:18px;accent-color:var(--accent)}
#pr .check[data-off="true"]{color:var(--muted)}
#pr .primary{font:inherit;font-weight:600;border:0;background:var(--accent);color:var(--accent-ink);padding:14px 22px;border-radius:12px;cursor:pointer;width:100%;font-size:1.05rem;min-height:52px}
#pr .primary:disabled{opacity:.45;cursor:not-allowed}
#pr .ghost{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:12px 18px;border-radius:12px;cursor:pointer;min-height:48px}
#pr button:focus-visible,#pr input:focus-visible,#pr select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#pr .note{color:var(--muted);font-size:.85rem;margin-top:8px}
#pr /* câu hỏi */
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
#pr .top .quit-box{margin-left:auto;white-space:nowrap}
#pr .bar{flex:1;height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
#pr .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
#pr .qtype{font-size:.8rem;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
#pr .qword{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.15;overflow-wrap:anywhere}
#pr .qipa{color:var(--accent);margin:6px 0 4px;display:flex;align-items:center;gap:10px}
#pr .qsent{font-family:Newsreader,Georgia,serif;font-size:1.5rem;line-height:1.6}
#pr .blank{display:inline-block;border-bottom:3px solid var(--ink);vertical-align:baseline;margin:0 2px;height:1em}
#pr .hint{color:var(--muted);margin-top:10px;font-size:.95rem}
#pr .hint b{color:var(--ink);font-weight:600}
#pr .spk{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;cursor:pointer;min-width:44px;min-height:44px;padding:0 14px;font:inherit}
#pr .big-spk{font-size:1.6rem;min-width:84px;min-height:84px;border-radius:50%}
#pr .listen{display:flex;gap:12px;align-items:center;margin:6px 0}
#pr .opts{display:grid;gap:10px;margin-top:18px}
#pr .opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:1.05rem;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:13px 14px;cursor:pointer;min-height:54px}
#pr .opt kbd{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.8rem;color:var(--muted);background:var(--card)}
#pr .opt:hover:not(:disabled){border-color:var(--accent)}
#pr .opt.right{border-color:var(--ok);background:var(--ok-bg)}
#pr .opt.wrong{border-color:var(--no);background:var(--no-bg)}
#pr .opt:disabled{cursor:default}
#pr .ans{display:flex;gap:10px;margin-top:18px}
#pr .ans input{flex:1;min-width:0;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
#pr .ans input.right{border-color:var(--ok);background:var(--ok-bg)}
#pr .ans input.wrong{border-color:var(--no);background:var(--no-bg)}
#pr .ans .primary{width:auto;padding:0 20px;font-size:1rem}
#pr .skip{margin-top:10px}
#pr .fb{margin-top:18px;border-radius:12px;padding:14px 16px;border:1.5px solid}
#pr .fb.right{border-color:var(--ok);background:var(--ok-bg)}
#pr .fb.wrong{border-color:var(--no);background:var(--no-bg)}
#pr .fb h3{font-size:1.05rem;margin-bottom:6px}
#pr .fb.right h3{color:var(--ok)}
#pr .fb.wrong h3{color:var(--no)}
#pr .fb p{margin:3px 0}
#pr .fb .ex{font-family:Newsreader,Georgia,serif;font-size:1.1rem}
#pr .fb .exvi{color:var(--muted);font-size:.92rem}
#pr .fb .next{margin-top:12px}
#pr mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
#pr /* kết quả */
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
#pr .score b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:3rem;line-height:1}
#pr .score span{color:var(--muted)}
#pr .wlist{list-style:none;margin:0;padding:0}
#pr .wlist li{padding:10px 0;border-bottom:1px solid var(--rule)}
#pr .wlist li:last-child{border-bottom:0}
#pr .wlist .w{font-weight:600}
#pr .wlist .m{color:var(--muted);font-size:.92rem}
#pr .actions{display:grid;gap:10px;margin-top:14px}
@media (max-width:520px){#pr .sheet{padding:16px}
#pr .modes{grid-template-columns:1fr}
#pr .mode.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){#pr .bar i{transition:none}}
#fc header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#fc h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
#fc .stats{color:var(--muted);font-size:.9rem}
#fc .stats b{color:var(--ink);font-weight:600}
#fc .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
#fc .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
#fc .chip small{color:var(--muted);margin-left:4px}
#fc .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#fc .chip[aria-pressed="true"] small{color:inherit;opacity:.85}
#fc .bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden;margin:2px 0 16px}
#fc .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#fc .pos-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}
#fc .scene{perspective:1400px}
#fc .card{display:grid;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none;border-radius:14px}
#fc .card.flipped{transform:rotateY(180deg)}
#fc .card:focus-visible{box-shadow:0 0 0 3px var(--accent)}
#fc .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:430px;background-color:var(--card);border-radius:14px;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-position:0 20px;padding:0 24px 22px;display:flex;flex-direction:column;overflow:hidden}
#fc .back{transform:rotateY(180deg)}
#fc .head{display:flex;justify-content:space-between;align-items:center;gap:12px;height:52px;margin:0 -24px;padding:0 24px;border-bottom:2px solid var(--red);background:var(--card);color:var(--muted);font-size:.85rem}
#fc .tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--ink);background:var(--chip);font-size:.8rem}
#fc .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:12px}
#fc .word{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(2rem,8vw,3rem);line-height:1.1;margin:0;overflow-wrap:anywhere;background:var(--card);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#fc .ipa{display:flex;align-items:center;gap:10px;font-size:1.1rem;color:var(--accent)}
#fc .ipa span{background:var(--card);padding:0 4px}
#fc .spk{border:1px solid var(--line);background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
#fc .spk:hover{border-color:var(--accent)}
#fc .spk:focus-visible{outline:3px solid var(--accent)}
#fc .lbl{font-size:.8rem;color:var(--muted);background:var(--card);display:inline-block;padding:0 4px}
#fc .ex{font-family:Newsreader,Georgia,serif;font-size:1.3rem;line-height:1.55;margin:0;background:var(--card);padding:2px 4px}
#fc .ex-vi{font-size:1rem;color:var(--muted);margin:0;line-height:1.55;background:var(--card);padding:2px 4px}
#fc mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
#fc .vi{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.2;margin:0;background:var(--card);padding:2px 4px;display:inline}
#fc .vi-wrap{line-height:1.2}
#fc .small-word{font-weight:600;color:var(--ink)}
#fc .flip-hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:auto;padding-top:8px;background:var(--card)}
#fc .badge{align-self:flex-start;font-size:.8rem;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 10px;background:var(--card)}
#fc .controls{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr;gap:10px;margin-top:18px}
#fc .btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:12px 8px;border-radius:12px;cursor:pointer;min-height:48px}
#fc .btn:hover{border-color:var(--accent)}
#fc .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#fc .btn.no{color:var(--no);border-color:var(--no)}
#fc .btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
#fc .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
#fc .tool{font:inherit;font-size:.85rem;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
#fc .tool[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);border-style:solid}
#fc .tool:hover{color:var(--ink)}
#fc .keys{text-align:center;color:var(--muted);font-size:.78rem;margin-top:14px}
#fc .empty{background:var(--card);border-radius:14px;padding:40px 24px;text-align:center;box-shadow:var(--shadow)}
#fc .empty h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px}
@media (max-width:520px){#fc .face{padding:0 18px 18px;min-height:460px}
#fc .head{margin:0 -18px;padding:0 18px}
#fc .controls{grid-template-columns:1fr 1fr;}
#fc .controls .prev{order:3}
#fc .controls .next{order:4}
#fc .keys{display:none}}
@media (prefers-reduced-motion:reduce){#fc .card{transition:none}
#fc .bar i{transition:none}}
.app{max-width:760px;margin:0 auto;padding:12px 16px 48px}
.shell-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip)}
.tabs button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--ink);padding:10px 18px;cursor:pointer;min-height:44px}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.panel[hidden]{display:none}
@media (max-width:520px){.app{padding:10px 12px 40px}.tabs{width:100%}.tabs button{flex:1}}

</style>
</head>
<body>
<div class="app">
  <div class="shell-head">
    <div class="brand">Từ vựng Anh – Việt</div>
    <div class="tabs" role="tablist" aria-label="Chế độ học">
      <button role="tab" id="tab-fc" aria-selected="true" aria-controls="fc">Flashcard</button>
      <button role="tab" id="tab-pr" aria-selected="false" aria-controls="pr">Luyện tập</button>
    </div>
  </div>
  <div id="fc" class="panel" role="tabpanel" aria-labelledby="tab-fc">

  <header>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Chọn bộ từ"></div>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="pos-line"><span id="counter"></span><span id="deckname"></span></div>
  <div id="stage"></div>
  <div class="controls" id="controls">
    <button class="btn prev" id="prev">‹ Trước</button>
    <button class="btn no" id="nope">Chưa thuộc</button>
    <button class="btn ok" id="gotit">Đã thuộc</button>
    <button class="btn next" id="next">Sau ›</button>
  </div>
  <div class="tools">
    <button class="tool" id="shuffle" aria-pressed="false">Xáo trộn</button>
    <button class="tool" id="onlyUnknown" aria-pressed="false">Chỉ ôn từ chưa thuộc</button>
    <button class="tool" id="toPractice">Luyện tập bộ này</button>
    <button class="tool" id="reset">Xóa tiến độ</button>
  </div>
  <div class="keys">Phím tắt: Space = lật · ← → = chuyển thẻ · 1 = chưa thuộc · 2 = đã thuộc · P = nghe phát âm</div>

  </div>
  <div id="pr" class="panel" role="tabpanel" aria-labelledby="tab-pr" hidden>
    <div id="view"></div>
  </div>
</div>
<script>
const DECKS = [
{id:'rel1', name:'Quan hệ 1', raw:`
acquaintance|n · get acquainted (v-phr) = làm quen|/əˈkweɪn.təns/|người quen|He isn't a close friend, just an *acquaintance* from my old job.|Anh ấy không phải bạn thân, chỉ là người quen từ chỗ làm cũ của tôi.
classmate|n|/ˈklæs.meɪt/|bạn cùng lớp|My *classmate* sits next to me in English class every day.|Bạn cùng lớp ngồi cạnh tôi trong giờ tiếng Anh mỗi ngày.
colleague|n|/ˈkɑː.liːɡ/|đồng nghiệp|I had lunch with a *colleague* from the marketing team.|Tôi ăn trưa với một đồng nghiệp ở nhóm marketing.
neighbour|n|/ˈneɪ.bɚ/|hàng xóm|Our *neighbour* always says hello when we meet in the hallway.|Hàng xóm của chúng tôi luôn chào khi gặp ở hành lang.
roommate|n|/ˈruːm.meɪt/|bạn cùng phòng|My *roommate* and I share the rent and the kitchen.|Bạn cùng phòng và tôi chia tiền nhà và dùng chung bếp.
couple|n|/ˈkʌp.əl/|cặp đôi|That *couple* holds hands everywhere they go.|Cặp đôi đó nắm tay nhau ở mọi nơi họ đến.
marriage|n|/ˈmer.ɪdʒ/|hôn nhân|Their *marriage* has lasted for thirty years.|Cuộc hôn nhân của họ đã kéo dài ba mươi năm.
wedding|n|/ˈwed.ɪŋ/|đám cưới|We danced all night at their *wedding*.|Chúng tôi nhảy cả đêm tại đám cưới của họ.
divorce|n|/dɪˈvɔːrs/|sự ly hôn|After the *divorce*, she moved back to her hometown.|Sau khi ly hôn, cô ấy chuyển về quê.
date|n|/deɪt/|buổi hẹn hò|Tom is nervous because he has a *date* with Lisa tonight.|Tom hồi hộp vì tối nay anh ấy có buổi hẹn hò với Lisa.
childhood friend|n phrase|/ˈtʃaɪld.hʊd frend/|bạn từ thời thơ ấu|She is my *childhood friend*; we played together when we were five.|Cô ấy là bạn thời thơ ấu của tôi; chúng tôi chơi cùng nhau từ năm tuổi.
best friend|n phrase|/best frend/|bạn thân nhất|My *best friend* knows all my secrets.|Bạn thân nhất của tôi biết mọi bí mật của tôi.
family member|n phrase|/ˈfæm.əl.i ˈmem.bɚ/|thành viên gia đình|Every *family member* came to my grandmother's birthday.|Mọi thành viên trong gia đình đều đến dự sinh nhật bà tôi.

// ---------- Dữ liệu ----------
const CARDS = [];
DECKS.forEach(d => d.raw.split('\n').forEach(line => {
  if (!line.trim()) return;
  const p = line.split('|').map(s => s.trim());
  CARDS.push({id: d.id + ':' + p[0], deck: d.id, w: p[0], pos: p[1], ipa: p[2], vi: p[3], ex: p[4], exvi: p[5]});
}));
const deckName = id => (DECKS.find(d => d.id === id) || {}).name || '';


const SHARED = {known: {}, tab: 'fc', goPractice: null};

(function () {
// ---------- Trạng thái ----------
const KEY = 'flashcard_known_v1';
const known = SHARED.known;
try { Object.assign(known, JSON.parse(localStorage.getItem(KEY) || '{}') || {}); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) {} }

let deckId = 'all', onlyUnknown = false, shuffled = false, order = [], idx = 0, flipped = false, busy = false;

const root = document.getElementById('fc');
const $ = id => root.querySelector('#' + id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*(.+?)\*/g, '<mark>$1</mark>');
const plain = s => s.replace(/\*/g, '');

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function build(resetIdx = true) {
  let list = CARDS.filter(c => (deckId === 'all' || c.deck === deckId) && (!onlyUnknown || !known[c.id]));
  order = shuffled ? shuffleArr(list.slice()) : list;
  if (resetIdx) idx = 0;
  if (idx >= order.length) idx = Math.max(0, order.length - 1);
  flipped = false;
  render();
}

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  const mk = (id, name) => {
    const set = id === 'all' ? CARDS : CARDS.filter(c => c.deck === id);
    const k = set.filter(c => known[c.id]).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-pressed', String(deckId === id));
    b.innerHTML = esc(name) + '<small>' + k + '/' + set.length + '</small>';
    b.onclick = () => { deckId = id; build(); };
    box.appendChild(b);
  };
  mk('all', 'Tất cả');
  DECKS.forEach(d => mk(d.id, d.name));
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\+ adj/g, '').replace(/\(.*?\)/g, '').split(' / ')[0]);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US');
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function render() {
  renderChips();
  const total = CARDS.filter(c => deckId === 'all' || c.deck === deckId);
  const k = total.filter(c => known[c.id]).length;
  $('stats').innerHTML = 'Đã thuộc <b>' + k + '</b>/' + total.length;
  $('barfill').style.width = (total.length ? k / total.length * 100 : 0) + '%';
  $('deckname').textContent = deckId === 'all' ? 'Tất cả bộ từ' : deckName(deckId);
  const stage = $('stage');
  const dis = order.length === 0;
  ['prev','next','nope','gotit'].forEach(i => $(i).disabled = dis);
  $('shuffle').setAttribute('aria-pressed', String(shuffled));
  $('onlyUnknown').setAttribute('aria-pressed', String(onlyUnknown));
  if (dis) {
    $('counter').textContent = '';
    stage.innerHTML = '<div class="empty"><h2>Bạn đã thuộc hết bộ này</h2><p>Không còn thẻ nào chưa thuộc. Tắt “Chỉ ôn từ chưa thuộc” hoặc chọn bộ từ khác để học tiếp.</p></div>';
    return;
  }
  const c = order[idx];
  $('counter').textContent = 'Thẻ ' + (idx + 1) + ' / ' + order.length;
  stage.innerHTML =
  '<div class="scene"><div class="card' + (flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Thẻ từ vựng: ' + esc(c.w) + '. Nhấn để lật.">' +
    '<div class="face front" aria-hidden="' + flipped + '">' +

function flip() {

}

function mark(val) {

      wrong.map(c => '<li><div class="w">' + esc(c.w) + ' <span class="m">' + esc(c.ipa) + '</span></div><div class="m">' + esc(c.vi) + '</div></li>').join('') + '</ul></section>' : '') +
    '<div class="actions">' +
      (wrong.length ? '<button class="primary" id="again">Luyện lại ' + wrong.length + ' từ sai</button>' : '') +
      '<button class="ghost" id="home">Làm bài mới</button></div>';
  if ($('again')) $('again').onclick = () => { const keep = S.count; S.count = 'all'; startQuiz(wrong); S.count = keep; };
  if ($('home')) $('home').onclick = renderSetup;
  window.scrollTo(0, 0);
}

// ---------- Phím tắt ----------
document.addEventListener('keydown', e => {
  if (SHARED.tab !== 'pr') return;
  if (!Q || !$('view').querySelector('.top')) return;
  const q = Q.items[Q.i];
  if (e.key === 'Enter' && Q.done) { e.preventDefault(); goNext(); return; }
  if (!Q.done && (q.t === 'ev' || q.t === 've') && /^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll('.opt')[+e.key - 1]; if (b) answer(b.dataset.id);
  }
});

window.PR = {
  refresh: () => { if (!inQuiz) renderSetup(); },
  focusDeck: id => { S.decks = id === 'all' ? new Set(DECKS.map(d => d.id)) : new Set([id]); S.fcUnknown = false; S.weakOnly = false; if (inQuiz) { inQuiz = false; } renderSetup(); }
};
renderSetup();

})();

// ---------- Chuyển tab ----------
const tabBtns = {fc: document.getElementById('tab-fc'), pr: document.getElementById('tab-pr')};
function switchTab(t) {
  SHARED.tab = t;
  document.getElementById('fc').hidden = t !== 'fc';
  document.getElementById('pr').hidden = t !== 'pr';
  Object.keys(tabBtns).forEach(k => tabBtns[k].setAttribute('aria-selected', String(k === t)));
  if (t === 'pr' && window.PR) window.PR.refresh();
  try { localStorage.setItem('vocab_tab', t); } catch (e) {}
  window.scrollTo(0, 0);
}
SHARED.goPractice = id => { switchTab('pr'); window.PR.focusDeck(id); };
tabBtns.fc.onclick = () => switchTab('fc');
tabBtns.pr.onclick = () => switchTab('pr');
let startTab = 'fc'; try { startTab = localStorage.getItem('vocab_tab') === 'pr' ? 'pr' : 'fc'; } catch (e) {}
switchTab(startTab);

</script>
</body>
</html>
