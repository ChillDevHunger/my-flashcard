<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard Anh – Việt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#e3ebee; --card:#fffefb; --ink:#1c2631; --muted:#5d6b7a; --rule:#d3e0ec; --red:#e0584f;
  --accent:#2a55d4; --accent-ink:#fff; --hl:#ffe45e; --hl-ink:#1c2631; --ok:#1f8a58; --no:#c8453d; --chip:#f4f8fa; --line:#c3d0da;
  --shadow:0 1px 0 rgba(28,38,49,.06),0 18px 40px -18px rgba(28,38,49,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#12181f; --card:#1e2733; --ink:#e9eef4; --muted:#9aa9b9; --rule:#2c3948; --red:#e86d64;
    --accent:#7a9bff; --accent-ink:#0f1620; --hl:#6e5f10; --hl-ink:#fff4b8; --ok:#4cc38a; --no:#ef7d74; --chip:#18212b; --line:#344254;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --desk:#12181f; --card:#1e2733; --ink:#e9eef4; --muted:#9aa9b9; --rule:#2c3948; --red:#e86d64;
  --accent:#7a9bff; --accent-ink:#0f1620; --hl:#6e5f10; --hl-ink:#fff4b8; --ok:#4cc38a; --no:#ef7d74; --chip:#18212b; --line:#344254;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.app{max-width:760px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
.stats{color:var(--muted);font-size:.9rem}
.stats b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden;margin:2px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.pos-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}

.scene{perspective:1400px}
.card{display:grid;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none;border-radius:14px}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:430px;background-color:var(--card);border-radius:14px;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-position:0 20px;padding:0 24px 22px;display:flex;flex-direction:column;overflow:hidden}
.back{transform:rotateY(180deg)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;height:52px;margin:0 -24px;padding:0 24px;border-bottom:2px solid var(--red);background:var(--card);color:var(--muted);font-size:.85rem}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--ink);background:var(--chip);font-size:.8rem}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:12px}
.word{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(2rem,8vw,3rem);line-height:1.1;margin:0;overflow-wrap:anywhere;background:var(--card);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ipa{display:flex;align-items:center;gap:10px;font-size:1.1rem;color:var(--accent)}
.ipa span{background:var(--card);padding:0 4px}
.spk{border:1px solid var(--line);background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.spk:hover{border-color:var(--accent)}
.spk:focus-visible{outline:3px solid var(--accent)}
.lbl{font-size:.8rem;color:var(--muted);background:var(--card);display:inline-block;padding:0 4px}
.ex{font-family:Newsreader,Georgia,serif;font-size:1.3rem;line-height:1.55;margin:0;background:var(--card);padding:2px 4px}
.ex-vi{font-size:1rem;color:var(--muted);margin:0;line-height:1.55;background:var(--card);padding:2px 4px}
mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
.vi{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.2;margin:0;background:var(--card);padding:2px 4px;display:inline}
.vi-wrap{line-height:1.2}
.small-word{font-weight:600;color:var(--ink)}
.flip-hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:auto;padding-top:8px;background:var(--card)}
.badge{align-self:flex-start;font-size:.8rem;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 10px;background:var(--card)}

.controls{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr;gap:10px;margin-top:18px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:12px 8px;border-radius:12px;cursor:pointer;min-height:48px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.no{color:var(--no);border-color:var(--no)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.tool{font:inherit;font-size:.85rem;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.tool[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);border-style:solid}
.tool:hover{color:var(--ink)}
.keys{text-align:center;color:var(--muted);font-size:.78rem;margin-top:14px}
.empty{background:var(--card);border-radius:14px;padding:40px 24px;text-align:center;box-shadow:var(--shadow)}
.empty h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px}
@media (max-width:520px){
  .app{padding:12px 12px 32px}
  .face{padding:0 18px 18px;min-height:460px}
  .head{margin:0 -18px;padding:0 18px}
  .controls{grid-template-columns:1fr 1fr;}
  .controls .prev{order:3}.controls .next{order:4}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Flashcard Anh – Việt</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Chọn bộ từ"></div>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="pos-line"><span id="counter"></span><span id="deckname"></span></div>
  <div id="stage"></div>
  <div class="controls" id="controls">
    <button class="btn prev" id="prev">‹ Trước</button>
    <button class="btn no" id="nope">Chưa thuộc</button>
    <button class="btn ok" id="gotit">Đã thuộc</button>
    <button class="btn next" id="next">Sau ›</button>
  </div>
  <div class="tools">
    <button class="tool" id="shuffle" aria-pressed="false">Xáo trộn</button>
    <button class="tool" id="onlyUnknown" aria-pressed="false">Chỉ ôn từ chưa thuộc</button>
    <button class="tool" id="reset">Xóa tiến độ</button>
  </div>
  <div class="keys">Phím tắt: Space = lật · ← → = chuyển thẻ · 1 = chưa thuộc · 2 = đã thuộc · P = nghe phát âm</div>
</div>

// ---------- Dữ liệu ----------
const CARDS = [];
DECKS.forEach(d => d.raw.split('\n').forEach(line => {
  if (!line.trim()) return;
  const p = line.split('|').map(s => s.trim());
  CARDS.push({id: d.id + ':' + p[0], deck: d.id, w: p[0], pos: p[1], ipa: p[2], vi: p[3], ex: p[4], exvi: p[5]});
}));
const deckName = id => (DECKS.find(d => d.id === id) || {}).name || '';

// ---------- Trạng thái ----------
const KEY = 'flashcard_known_v1';
let known = {};
try { known = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { known = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) {} }

let deckId = 'all', onlyUnknown = false, shuffled = false, order = [], idx = 0, flipped = false, busy = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*(.+?)\*/g, '<mark>$1</mark>');
const plain = s => s.replace(/\*/g, '');

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function build(resetIdx = true) {
  let list = CARDS.filter(c => (deckId === 'all' || c.deck === deckId) && (!onlyUnknown || !known[c.id]));
  order = shuffled ? shuffleArr(list.slice()) : list;
  if (resetIdx) idx = 0;
  if (idx >= order.length) idx = Math.max(0, order.length - 1);
  flipped = false;
  render();
}

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  const mk = (id, name) => {
    const set = id === 'all' ? CARDS : CARDS.filter(c => c.deck === id);
    const k = set.filter(c => known[c.id]).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-pressed', String(deckId === id));
    b.innerHTML = esc(name) + '<small>' + k + '/' + set.length + '</small>';
    b.onclick = () => { deckId = id; build(); };
    box.appendChild(b);
  };
  mk('all', 'Tất cả');
  DECKS.forEach(d => mk(d.id, d.name));
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\+ adj/g, '').replace(/\(.*?\)/g, '').split(' / ')[0]);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US');
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function render() {
  renderChips();
  const total = CARDS.filter(c => deckId === 'all' || c.deck === deckId);
  const k = total.filter(c => known[c.id]).length;
  $('stats').innerHTML = 'Đã thuộc <b>' + k + '</b>/' + total.length;
  $('barfill').style.width = (total.length ? k / total.length * 100 : 0) + '%';
  $('deckname').textContent = deckId === 'all' ? 'Tất cả bộ từ' : deckName(deckId);
  const stage = $('stage');
  const dis = order.length === 0;
  ['prev','next','nope','gotit'].forEach(i => $(i).disabled = dis);
  $('shuffle').setAttribute('aria-pressed', String(shuffled));
  $('onlyUnknown').setAttribute('aria-pressed', String(onlyUnknown));
  if (dis) {
    $('counter').textContent = '';
    stage.innerHTML = '<div class="empty"><h2>Bạn đã thuộc hết bộ này</h2><p>Không còn thẻ nào chưa thuộc. Tắt “Chỉ ôn từ chưa thuộc” hoặc chọn bộ từ khác để học tiếp.</p></div>';
    return;
  }
  const c = order[idx];
  $('counter').textContent = 'Thẻ ' + (idx + 1) + ' / ' + order.length;
  stage.innerHTML =
  '<div class="scene"><div class="card' + (flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Thẻ từ vựng: ' + esc(c.w) + '. Nhấn để lật.">' +
    '<div class="face front" aria-hidden="' + flipped + '">' +
      '<div class="head"><span>' + esc(deckName(c.deck)) + '</span><span class="tag">' + esc(c.pos) + '</span></div>' +
      '<div class="body">' +
        '<div><h2 class="word">' + esc(c.w) + '</h2></div>' +
        '<div class="ipa"><span>🇺🇸 ' + esc(c.ipa) + '</span><button class="spk" aria-label="Nghe phát âm" id="spk">🔊</button></div>' +
        '<div><span class="lbl">Đoán nghĩa từ ví dụ</span><p class="ex">' + fmt(c.ex) + '</p></div>' +
      '</div>' +
      '<div class="flip-hint">Chạm để xem nghĩa</div>' +
    '</div>' +
    '<div class="face back" aria-hidden="' + !flipped + '">' +
      '<div class="head"><span><span class="small-word">' + esc(c.w) + '</span> &nbsp;' + esc(c.ipa) + '</span><span class="tag">' + esc(c.pos) + '</span></div>' +
      '<div class="body">' +
        (known[c.id] ? '<span class="badge">✓ Đã thuộc</span>' : '') +
        '<div class="vi-wrap"><h2 class="vi">' + esc(c.vi) + '</h2></div>' +
        '<div><span class="lbl">Ví dụ</span><p class="ex">' + fmt(c.ex) + '</p><p class="ex-vi">' + esc(c.exvi) + '</p></div>' +
      '</div>' +
      '<div class="flip-hint">Chạm để quay lại</div>' +
    '</div>' +
  '</div></div>';
  const card = $('card');
  card.onclick = flip;
  $('spk').onclick = e => { e.stopPropagation(); speak(c.w); };
}

function flip() {
  if (!order.length) return;
  flipped = !flipped;
  const card = $('card'); if (card) card.classList.toggle('flipped', flipped);
}

function go(delta, thenFn) {
  if (!order.length || busy) return;
  const change = () => { if (thenFn) thenFn(); idx = (idx + delta + order.length) % order.length; flipped = false; busy = false; render(); };
  if (flipped) {
    busy = true; flipped = false;
    const card = $('card'); if (card) card.classList.remove('flipped');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(change, reduce ? 0 : 280);
  } else change();
}

function mark(val) {
  if (!order.length) return;
  const c = order[idx];
  if (val) known[c.id] = 1; else delete known[c.id];
  save();
  if (onlyUnknown && val) {
    // thẻ vừa thuộc sẽ rời khỏi danh sách ôn
    const was = idx;
    go(0, () => { order.splice(was, 1); idx = was; if (idx >= order.length) idx = 0; });
    if (order.length === 0) { render(); }
    return;
  }
  go(1);
}

$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('nope').onclick = () => mark(false);
$('gotit').onclick = () => mark(true);
$('shuffle').onclick = () => { shuffled = !shuffled; build(); };
$('onlyUnknown').onclick = () => { onlyUnknown = !onlyUnknown; build(); };
$('reset').onclick = () => {
  if (confirm('Xóa toàn bộ tiến độ “đã thuộc”?')) { known = {}; save(); onlyUnknown = false; build(); }
};

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
    if (e.key === ' ' || e.key === 'Enter') return; // để nút tự xử lý
  }
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.id === 'card' || e.target === document.body) { e.preventDefault(); flip(); } }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === '1') mark(false);
  else if (e.key === '2') mark(true);
  else if (e.key === 'p' || e.key === 'P') { if (order[idx]) speak(order[idx].w); }
});

build();
</script>
